<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELKHAWAGA CRYSTAL — تسجيل الدخول</title>
    <meta name="description" content="لوحة تحكم الخواجة كريستال — تسجيل دخول المسؤول" />
    <link rel="icon" type="image/png" href="images/logo.png" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="login-page">
    <!-- Spinner -->
    <div id="globalSpinner" class="d-none">
      <div class="spinner-inner">
        <div class="spinner-border" role="status"></div>
        <p>جارٍ تسجيل الدخول...</p>
      </div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <!-- Login Card -->
    <div class="login-card animate-in">
      <div class="login-logo">
        <div class="logo-circle" style="background:none;box-shadow:none;padding:0;width:90px;height:90px;">
          <img src="images/logo.png" alt="ELKHAWAGA CRYSTAL" style="width:90px;height:90px;object-fit:contain;border-radius:50%;" />
        </div>
        <h2 class="fw-black mt-2">ELKHAWAGA CRYSTAL</h2>
        <p class="subtitle">لوحة التحكم — تسجيل الدخول</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="emailInput" class="form-label">البريد الإلكتروني</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input
              type="email"
              id="emailInput"
              class="form-control"
              placeholder="admin@example.com"
              required
              autocomplete="email"
            />
          </div>
          <div class="invalid-feedback">الرجاء إدخال بريد إلكتروني صحيح</div>
        </div>

        <div class="mb-4">
          <label for="passwordInput" class="form-label">كلمة المرور</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input
              type="password"
              id="passwordInput"
              class="form-control"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <button type="button" id="togglePassword" class="input-group-text bg-light" style="cursor:pointer">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
          <div class="invalid-feedback">الرجاء إدخال كلمة المرور</div>
        </div>

        <button type="submit" id="loginBtn" class="btn-login">
          <i class="bi bi-box-arrow-in-right me-2"></i> تسجيل الدخول
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="index.html" class="text-muted text-decoration-none small">
          <i class="bi bi-arrow-right me-1"></i> العودة للكاتالوج
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { loginAdmin, redirectIfLoggedIn } from "./js/auth.js";
      import { showToast } from "./js/ui.js";

      // Redirect if already logged in
      redirectIfLoggedIn();

      // Toggle password visibility
      document.getElementById("togglePassword").addEventListener("click", () => {
        const input = document.getElementById("passwordInput");
        const icon = document.getElementById("eyeIcon");
        if (input.type === "password") {
          input.type = "text";
          icon.className = "bi bi-eye-slash";
        } else {
          input.type = "password";
          icon.className = "bi bi-eye";
        }
      });

      // Login form submit
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;

        if (!email || !password) {
          showToast("الرجاء ملء جميع الحقول", "warning");
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showToast("البريد الإلكتروني غير صالح", "warning");
          return;
        }

        await loginAdmin(email, password);
      });
    </script>
  </body>
</html>
