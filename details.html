<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELKHAWAGA CRYSTAL — تفاصيل المنتج</title>
  <meta name="description" content="تفاصيل المنتج من كتالوج الخواجة كريستال" />
  <link rel="icon" type="image/png" href="images/logo.png" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- Spinner -->
  <div id="globalSpinner" class="d-none">
    <div class="spinner-inner">
      <div class="spinner-border" role="status"></div>
      <p>جارٍ التحميل...</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="images/logo.png" alt="ELKHAWAGA CRYSTAL"
          style="height:44px;width:44px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,0.15);padding:2px;" />
        <span>ELKHAWAGA CRYSTAL</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i> الرئيسية</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Breadcrumb -->
  <div class="bg-white border-bottom py-2">
    <div class="container">
      <nav aria-label="مسار التنقل">
        <ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-danger">الرئيسية</a></li>
          <li class="breadcrumb-item active" id="breadcrumbName">تفاصيل المنتج</li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container my-5" id="detailContent">
    <!-- Injected by JS -->
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container py-4">
      <div class="row g-4 text-center text-lg-start">
        <div class="col-md-4">
          <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt-fill text-danger me-1"></i> العنوان</h5>
          <p class="mb-0 text-muted">3 ش المرسي العشري – المنطقة الصناعية – المحلة الكبرى</p>
        </div>
        <div class="col-md-4">
          <h5 class="fw-bold mb-3"><i class="bi bi-telephone-fill text-danger me-1"></i> تواصل معنا</h5>
          <ul class="list-unstyled text-muted mb-0">
            <li class="mb-2" dir="ltr"><a href="tel:01288678888" class="text-decoration-none text-muted">01288678888
            </li>
            <li class="mb-2" dir="ltr"><a href="tel:01009154415" class="text-decoration-none text-muted">01009154415</a>
            </li>
            <li dir="ltr"><a href="tel:01152000793" class="text-decoration-none text-muted">01152000793</a></li>
          </ul>
        </div>
        <div class="col-md-4">
          <h5 class="fw-bold mb-3"><i class="bi bi-facebook text-primary me-1"></i> تابعنا</h5>
          <div class="justify-content-center text-md-start">
            <a href="https://www.facebook.com/share/1B6DmYqRGU/" target="_blank" class="btn btn-outline-primary btn-sm">
              <i class="bi bi-facebook me-1"></i> صفحتنا على فيسبوك
            </a>
          </div>
        </div>
      </div>
      <hr class="mt-4 mb-3" style="opacity: 0.1;">
      <p class="mb-0 text-center text-muted">جميع الحقوق محفوظة &copy; <span id="year"></span> — الخواجة كريستال</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { getProduct } from "./js/products.js";
    import { getCategories } from "./js/categories.js";
    import { showSpinner, hideSpinner, formatPrice } from "./js/ui.js";

    document.getElementById("year").textContent = new Date().getFullYear();

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        window.location.href = "index.html";
        return;
      }

      showSpinner();
      try {
        const [product, categories] = await Promise.all([
          getProduct(id),
          getCategories(),
        ]);

        if (!product) {
          window.location.href = "index.html";
          return;
        }

        const catName =
          categories.find((c) => c.id === product.category_id)?.name || "غير مصنف";

        document.title = `${product.name} — الخواجة كريستال`;
        document.getElementById("breadcrumbName").textContent = product.name;

        const main = document.getElementById("detailContent");
        main.innerHTML = `
            <div class="row g-4 align-items-start">
              <!-- Images Gallery -->
              <div class="col-lg-6">
                <div class="detail-image-wrap" id="mainImageWrap">
                  ${(product.images && product.images.length > 0)
            ? `<img id="mainProductImage" src="${product.images[0].url}" alt="${product.name}" />`
            : (product.image_url
              ? `<img id="mainProductImage" src="${product.image_url}" alt="${product.name}" />`
              : `<div class="text-center p-5 text-muted">
                           <i class="bi bi-image fs-1 d-block mb-2"></i>
                           <span>لا توجد صورة</span>
                         </div>`)
          }
                </div>
                ${(product.images && product.images.length > 1)
            ? `<div class="d-flex gap-2 mt-3 flex-wrap" id="thumbnailGallery">
                      ${product.images.map((img, idx) => `
                        <div class="thumbnail-item ${idx === 0 ? 'active' : ''}" style="width: 80px; height: 80px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid ${idx === 0 ? 'var(--primary)' : 'transparent'}; transition: border-color 0.2s;" onclick="changeMainImage('${img.url}', this)">
                          <img src="${img.url}" style="width: 100%; height: 100%; object-fit: cover;" alt="thumbnail" />
                        </div>
                      `).join('')}
                    </div>`
            : ''}
              </div>

              <!-- Info -->
              <div class="col-lg-6">
                <div class="detail-info-card">
                  <span class="info-badge">
                    <i class="bi bi-grid-3x3-gap-fill"></i> ${catName}
                  </span>
                  <h1 class="product-name">${product.name}</h1>
                  <div class="product-price">${formatPrice(product.price)}</div>

                  ${product.description
            ? `<div class="product-desc">
                           <p class="fw-semibold mb-1 text-dark"><i class="bi bi-align-right me-1"></i> الوصف</p>
                           <p>${product.description}</p>
                         </div>`
            : ""
          }

                  <div class="mt-4 d-flex gap-2 flex-wrap">
                    <a href="index.html" class="btn btn-outline-secondary">
                      <i class="bi bi-arrow-right me-1"></i> العودة للكتالوج
                    </a>
                    <a href="https://wa.me/201099510555" target="_blank" class="btn btn-success">
                      <i class="bi bi-whatsapp me-1"></i> تواصل عبر واتساب
                    </a>
                    <a href="https://www.facebook.com/profile.php?id=100090142286793" target="_blank" class="btn btn-primary">
                      <i class="bi bi-facebook me-1"></i> تواصل عبر فيسبوك
                    </a>
                  </div>
                </div>
              </div>
            </div>`;
      } catch (e) {
        console.error(e);
        document.getElementById("detailContent").innerHTML = `
            <div class="text-center py-5">
              <i class="bi bi-exclamation-triangle fs-1 text-danger d-block mb-3"></i>
              <h3>حدث خطأ أثناء تحميل المنتج</h3>
              <a href="index.html" class="btn btn-outline-danger mt-3">العودة للرئيسية</a>
            </div>`;
      } finally {
        hideSpinner();
      }
    }

    init();

    // Global function for gallery
    window.changeMainImage = function (url, el) {
      document.getElementById("mainProductImage").src = url;
      document.querySelectorAll(".thumbnail-item").forEach(item => {
        item.style.borderColor = "transparent";
      });
      el.style.borderColor = "var(--primary)";
    };
  </script>
</body>

</html>
